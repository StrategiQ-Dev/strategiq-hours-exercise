<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Hours Exercise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Hours Exercise" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    :root {
      --primary: #FCFBF9;
      --secondary: #0D0C0C;
      --tertiary: #F8F8F8;
      --accent: #FF4306;
      --text-color: #FFFFFF;
      --black: #0D0C0C;
      --grey: #F2F1EF;
      --light-grey: #E9E9E9;
      --white: #FFFFFF;
      --he-font: 'Outfit', system-ui, sans-serif;
      --he-bg: var(--primary);
      --he-surface: var(--white);
      --he-text: var(--secondary);
      --he-text-muted: var(--secondary);
      --he-text-soft: var(--secondary);
      --he-text-subtle: var(--black);
      --he-border: var(--light-grey);
      --he-border-soft: var(--grey);
      --he-success: var(--accent);
      --he-success-soft: var(--light-grey);
      --he-success-bg: var(--tertiary);
      --he-success-text: var(--secondary);
      --he-danger: var(--accent);
      --he-warning: var(--accent);
      --he-warning-soft: var(--light-grey);
      --he-warning-bg: var(--tertiary);
      --he-warning-text: var(--secondary);
      --he-warning-text-soft: var(--secondary);
      --he-info: var(--accent);
      --he-primary-subtle: var(--text-color);
      --he-shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.07);
      --he-radius-sm: 8px;
      --he-radius-md: 10px;
      --he-radius-lg: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--he-font);
      background: var(--he-bg);
      color: var(--he-text);
      -webkit-font-smoothing: antialiased;
    }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--he-border);
      outline: none;
      width: 100%;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--he-text);
      cursor: pointer;
      border: none;
    }
    input[type=date]::-webkit-calendar-picker-indicator {
      opacity: 0.5;
      cursor: pointer;
    }
    button { font-family: var(--he-font); }
    textarea { font-family: var(--he-font); }
    input { font-family: var(--he-font); }
    .he-btn-primary,
    .he-btn-secondary {
      transition: transform 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    }
    .he-btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(13, 12, 12, 0.18);
      background: var(--accent);
      color: var(--white);
    }
    .he-btn-secondary:hover {
      transform: translateY(-1px);
      background: var(--tertiary);
      border-color: var(--accent);
      color: var(--accent);
    }
    @media print {
      #he-topbar { display: none !important; }
      .no-print { display: none !important; }
      body { background: var(--he-surface); }
    }
    @media (max-width: 600px) {
      .stat-grid-4 { grid-template-columns: 1fr 1fr !important; }
      .intro-meta { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const STORAGE_KEY = "hours-exercise-v1";

    const SKILLS = [
      "Strategic thinking",
      "Pitching & winning",
      "Omnichannel",
      "Commercial acumen",
      "Analytical",
      "Presentation",
      "Team leadership",
      "Client relationships",
    ];

    const getDefaultDate = () => `${new Date().getFullYear()}-12-31`;

    const makeDefault = () => ({
      step: 0,
      name: "",
      goal: "",
      targetDate: getDefaultDate(),
      sleep: 7,
      exercise: 1,
      travel: 2,
      eating: 2,
      family: 2,
      skills: [0, 0, 0, 0, 0, 0, 0, 0],
      evidence: ["", "", "", "", "", "", "", ""],
    });

    const getSkillColor = (score) => {
      if (score < 4) return "var(--he-danger)";
      if (score < 6) return "var(--he-warning)";
      if (score === 6) return "var(--he-info)";
      return "var(--he-success)";
    };

    const daysRemaining = (dateStr) => {
      if (!dateStr) return 0;
      const [y, m, d] = dateStr.split("-").map(Number);
      const target = new Date(y, m - 1, d);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return Math.max(0, Math.ceil((target - today) / 86400000));
    };

    const formatDate = (dateStr) => {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("en-GB", {
        day: "numeric", month: "long", year: "numeric",
      });
    };

    // Storage helpers — uses localStorage for standalone HTML
    const storage = {
      get: (key) => {
        try { return localStorage.getItem(key); } catch (_) { return null; }
      },
      set: (key, val) => {
        try {
          if (val == null) localStorage.removeItem(key);
          else localStorage.setItem(key, val);
        } catch (_) {}
      },
    };

    // ── Stable sub-components (defined at module level) ──────────────────────

    function SliderRow({ label, value, min, max, onChange }) {
      return (
        <div style={{ marginBottom: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
            <span style={{ fontSize: 14, fontWeight: 600, color: "var(--he-text)" }}>{label}</span>
            <span style={{ fontSize: 15, fontWeight: 800, color: "var(--he-text)", minWidth: 36, textAlign: "right" }}>
              {value}h
            </span>
          </div>
          <input
            type="range"
            min={min}
            max={max}
            step={0.5}
            value={value}
            onChange={(e) => onChange(parseFloat(e.target.value))}
          />
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "var(--he-text-subtle)", marginTop: 4 }}>
            <span>{min}h</span>
            <span>{max}h</span>
          </div>
        </div>
      );
    }

    function StatCard({ label, value, navy }) {
      return (
        <div style={{
          background: navy ? "var(--he-text)" : "var(--he-surface)",
          borderRadius: "var(--he-radius-md)",
          padding: "22px 16px",
          textAlign: "center",
          boxShadow: "var(--he-shadow-sm)",
        }}>
          <div style={{ fontSize: 32, fontWeight: 900, color: navy ? "var(--he-bg)" : "var(--he-text)", letterSpacing: "-0.02em" }}>
            {value}
          </div>
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.07em", textTransform: "uppercase", marginTop: 4, color: navy ? "var(--text-color)" : "var(--he-text-muted)" }}>
            {label}
          </div>
        </div>
      );
    }

    // ── Main app ─────────────────────────────────────────────────────────────

    function HoursExercise() {
      const [state, setState] = useState(makeDefault);
      const [savedIndicator, setSavedIndicator] = useState(false);
      const [hasSavedData, setHasSavedData] = useState(false);
      const [errors, setErrors] = useState({});

      // Check for saved data on mount
      useEffect(() => {
        try {
          const raw = storage.get(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.step > 0) setHasSavedData(true);
          }
        } catch (_) {}
      }, []);

      // Save on every state change (skip intro)
      useEffect(() => {
        if (state.step === 0) return;
        storage.set(STORAGE_KEY, JSON.stringify(state));
        setSavedIndicator(true);
        const t = setTimeout(() => setSavedIndicator(false), 2200);
        return () => clearTimeout(t);
      }, [state]);

      const update = (patch) => setState((prev) => ({ ...prev, ...patch }));

      const resume = () => {
        try {
          const raw = storage.get(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed) setState({ ...makeDefault(), ...parsed });
          }
        } catch (_) {}
      };

      const startAgain = () => {
        if (window.confirm("Are you sure? This will clear all your saved progress.")) {
          storage.set(STORAGE_KEY, null);
          setState(makeDefault());
          setHasSavedData(false);
        }
      };

      // Computed
      const totalLife = state.sleep + state.exercise + state.travel + state.eating + state.family;
      const freePerDay = Math.max(0, 24 - totalLife);
      const days = daysRemaining(state.targetDate);
      const realHours = Math.round(freePerDay * days);
      const gaps = state.skills.filter((s) => s < 6).length;
      const avgScore = (state.skills.reduce((a, b) => a + b, 0) / 8).toFixed(1);
      const progress = (state.step / 6) * 100;

      // Style tokens
      const ff = "var(--he-font)";

      const cardBase = {
        background: "var(--he-surface)",
        borderRadius: "var(--he-radius-lg)",
        padding: "28px 32px",
        boxShadow: "var(--he-shadow-sm)",
        marginBottom: 20,
      };

      const navyCardBase = {
        background: "#0D0C0C",
        color: "#FFFFFF",
        borderRadius: "var(--he-radius-lg)",
        padding: "28px 32px",
        marginBottom: 20,
      };

      const btnPrimary = {
        background: "var(--he-text)",
        color: "var(--he-bg)",
        border: "none",
        borderRadius: "var(--he-radius-sm)",
        padding: "12px 28px",
        fontSize: 15,
        fontWeight: 700,
        cursor: "pointer",
        fontFamily: ff,
        letterSpacing: "-0.01em",
      };

      const btnSecondary = {
        background: "transparent",
        color: "var(--he-text)",
        border: "2px solid var(--he-border)",
        borderRadius: "var(--he-radius-sm)",
        padding: "10px 22px",
        fontSize: 15,
        fontWeight: 600,
        cursor: "pointer",
        fontFamily: ff,
      };

      const inputBase = {
        width: "100%",
        padding: "11px 14px",
        border: "1.5px solid var(--he-border)",
        borderRadius: "var(--he-radius-sm)",
        fontSize: 15,
        fontFamily: ff,
        color: "var(--he-text)",
        background: "var(--he-bg)",
        outline: "none",
      };

      const labelStyle = {
        display: "block",
        fontSize: 11,
        fontWeight: 700,
        letterSpacing: "0.07em",
        textTransform: "uppercase",
        color: "var(--he-text-muted)",
        marginBottom: 8,
      };

      const rowStyle = { display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" };

      const h2Style = { fontSize: 28, fontWeight: 800, color: "var(--he-text)", margin: "0 0 8px", letterSpacing: "-0.02em" };
      const subStyle = { fontSize: 15, color: "var(--he-text-muted)", margin: "0 0 28px", lineHeight: 1.65 };

      // ── Step 0: Intro ──────────────────────────────────────────────────────
      const renderIntro = () => (
        <div style={{ maxWidth: 540, margin: "0 auto", padding: "72px 0" }}>
          <img
            src="assets/strategiq-logo-black.svg"
            alt="StrategiQ"
            style={{ position: "fixed", top: 24, left: 24, height: 22, width: "auto", display: "block", zIndex: 20 }}
          />
          <p style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--he-text-subtle)", margin: "0 0 16px" }}>
            Career Planning Framework
          </p>
          <h1 style={{ fontSize: 48, fontWeight: 900, lineHeight: 1.05, margin: "0 0 24px", color: "var(--he-text)", letterSpacing: "-0.03em" }}>
            The Hours<br />Exercise
          </h1>
          <p style={{ fontSize: 17, color: "var(--he-text-soft)", lineHeight: 1.72, margin: "0 0 44px", maxWidth: 460 }}>
            A structured six-step process to clarify your career goal, understand the time you truly have available, and build a deliberate plan for the skills that will get you there.
          </p>
          <div style={rowStyle}>
            <button className="he-btn-primary" style={btnPrimary} onClick={() => update({ step: 1 })}>Begin the exercise →</button>
            {hasSavedData && (
              <button className="he-btn-secondary" style={btnSecondary} onClick={resume}>Resume where I left off</button>
            )}
          </div>
          <div className="intro-meta" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginTop: 56, paddingTop: 40, borderTop: "1px solid var(--he-border)" }}>
            {["6 steps", "~20 minutes", "Saves automatically"].map((t) => (
              <div key={t} style={{ background: "var(--he-surface)", border: "1px solid var(--he-border)", borderRadius: "var(--he-radius-sm)", padding: "14px 12px", textAlign: "center" }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: "var(--he-text-muted)" }}>{t}</span>
              </div>
            ))}
          </div>
        </div>
      );

      // ── Step 1: Goal inputs ────────────────────────────────────────────────
      const renderStep1 = () => {
        const validate = () => {
          const e = {};
          if (!state.name.trim()) e.name = "Please enter your name.";
          if (!state.goal.trim()) e.goal = "Please enter your goal.";
          if (!state.targetDate) e.targetDate = "Please select a target date.";
          setErrors(e);
          return Object.keys(e).length === 0;
        };

        return (
          <div>
            <h2 style={h2Style}>The Goal</h2>
            <p style={subStyle}>Start with who you are and what you are aiming for.</p>
            <div style={cardBase}>
              <div style={{ marginBottom: 22 }}>
                <label style={labelStyle}>Your name</label>
                <input
                  type="text"
                  style={{ ...inputBase, borderColor: errors.name ? "var(--he-danger)" : "var(--he-border)" }}
                  value={state.name}
                  onChange={(e) => { update({ name: e.target.value }); if (errors.name) setErrors((p) => ({ ...p, name: undefined })); }}
                  placeholder="e.g. Sarah Jones"
                />
                {errors.name && <p style={{ margin: "6px 0 0", fontSize: 12, color: "var(--he-danger)" }}>{errors.name}</p>}
              </div>

              <div style={{ marginBottom: 22 }}>
                <label style={labelStyle}>Your goal</label>
                <input
                  type="text"
                  style={{ ...inputBase, borderColor: errors.goal ? "var(--he-danger)" : "var(--he-border)" }}
                  value={state.goal}
                  onChange={(e) => { update({ goal: e.target.value }); if (errors.goal) setErrors((p) => ({ ...p, goal: undefined })); }}
                  placeholder="e.g. Client Director"
                />
                {errors.goal && <p style={{ margin: "6px 0 0", fontSize: 12, color: "var(--he-danger)" }}>{errors.goal}</p>}
              </div>

              <div style={{ marginBottom: 4 }}>
                <label style={labelStyle}>Target date</label>
                <input
                  type="date"
                  style={{ ...inputBase, borderColor: errors.targetDate ? "var(--he-danger)" : "var(--he-border)" }}
                  value={state.targetDate}
                  onChange={(e) => { update({ targetDate: e.target.value }); if (errors.targetDate) setErrors((p) => ({ ...p, targetDate: undefined })); }}
                />
                {errors.targetDate && <p style={{ margin: "6px 0 0", fontSize: 12, color: "var(--he-danger)" }}>{errors.targetDate}</p>}
              </div>
            </div>
            <button className="he-btn-primary" style={btnPrimary} onClick={() => { if (validate()) update({ step: 2 }); }}>
              Next: Life Hours →
            </button>
          </div>
        );
      };

      // ── Step 2: Life hours ─────────────────────────────────────────────────
      const renderStep2 = () => (
        <div>
          <h2 style={h2Style}>Life Hours</h2>
          <p style={subStyle}>Adjust the sliders to reflect your real daily commitments. This reveals how much time you truly have.</p>
          <div style={cardBase}>
            <SliderRow label="Sleep" value={state.sleep} min={5} max={10} onChange={(v) => update({ sleep: v })} />
            <SliderRow label="Exercise" value={state.exercise} min={0} max={3} onChange={(v) => update({ exercise: v })} />
            <SliderRow label="Travel / Commute" value={state.travel} min={0} max={5} onChange={(v) => update({ travel: v })} />
            <SliderRow label="Eating & Daily Admin" value={state.eating} min={1} max={4} onChange={(v) => update({ eating: v })} />
            <SliderRow label="Family & Friends" value={state.family} min={0} max={5} onChange={(v) => update({ family: v })} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 28 }}>
            <StatCard label="Total Life Hours / Day" value={`${totalLife}h`} />
            <StatCard label="Free Hours / Day" value={`${freePerDay.toFixed(1)}h`} />
            <StatCard label="Days Remaining" value={days.toLocaleString()} />
            <StatCard label="Real Hours" value={realHours.toLocaleString()} navy={true} />
          </div>
          <div style={rowStyle}>
            <button className="he-btn-secondary" style={btnSecondary} onClick={() => update({ step: 1 })}>← Back</button>
            <button className="he-btn-primary" style={btnPrimary} onClick={() => update({ step: 3 })}>Next: Reality Check →</button>
          </div>
        </div>
      );

      // ── Step 3: Reality check ──────────────────────────────────────────────
      const renderStep3 = () => (
        <div>
          <h2 style={h2Style}>The Reality Check</h2>
          <p style={subStyle}>Take a moment to sit with this number.</p>

          <div style={{ ...navyCardBase, textAlign: "center", padding: "56px 32px" }}>
            <p style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--white)", margin: "0 0 20px" }}>
              Your Real Hours to {state.goal}
            </p>
            <div style={{ fontSize: 96, fontWeight: 900, lineHeight: 1, color: "var(--he-bg)", letterSpacing: "-0.04em" }}>
              {realHours.toLocaleString()}
            </div>
            <p style={{ fontSize: 15, color: "var(--white)", margin: "18px 0 0" }}>
              hours between now and {formatDate(state.targetDate)}
            </p>
          </div>

          <div style={{ ...cardBase, borderLeft: "4px solid var(--he-warning)", background: "var(--he-warning-bg)", padding: "22px 24px" }}>
            <p style={{ fontSize: 14, fontWeight: 700, color: "var(--he-warning-text)", margin: "0 0 8px" }}>You've already spent some getting here — be deliberate</p>
            <p style={{ fontSize: 14, color: "var(--he-warning-text-soft)", lineHeight: 1.68, margin: 0 }}>
              Those {realHours.toLocaleString()} hours will pass regardless. The question is whether you spend them deliberately. Every interaction, every project, every conversation either builds the case for your goal — or it doesn't.
            </p>
          </div>

          <div style={{ ...cardBase, borderLeft: "4px solid var(--he-text)", background: "var(--he-border-soft)", padding: "22px 24px" }}>
            <p style={{ fontSize: 14, fontWeight: 700, color: "var(--he-text)", margin: "0 0 8px" }}>High achievement is a seven-day mindset, not five</p>
            <p style={{ fontSize: 14, color: "var(--he-text-soft)", lineHeight: 1.68, margin: 0 }}>
              The people who get there fastest don't switch off at the weekend. That doesn't mean working every hour — it means staying curious, building relationships, and thinking about your goal seven days a week.
            </p>
          </div>

          <div style={rowStyle}>
            <button className="he-btn-secondary" style={btnSecondary} onClick={() => update({ step: 2 })}>← Back</button>
            <button className="he-btn-primary" style={btnPrimary} onClick={() => update({ step: 4 })}>Next: Skills Assessment →</button>
          </div>
        </div>
      );

      // ── Step 4: Skills assessment ──────────────────────────────────────────
      const renderStep4 = () => (
        <div>
          <h2 style={h2Style}>Skills Assessment</h2>
          <p style={subStyle}>Rate yourself honestly from 0 to 10. The target for each skill is 6.</p>
          <div style={{ ...cardBase, padding: "28px 32px 8px" }}>
            {SKILLS.map((skill, i) => {
              const score = state.skills[i];
              const color = getSkillColor(score);
              return (
                <div key={skill} style={{ marginBottom: 30 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
                    <span style={{ fontSize: 14, fontWeight: 700, color: "var(--he-text)" }}>{skill}</span>
                    <span style={{ fontSize: 18, fontWeight: 900, color, letterSpacing: "-0.02em" }}>{score}/10</span>
                  </div>
                  <div style={{ display: "flex", gap: 5 }}>
                    {Array.from({ length: 10 }, (_, pip) => {
                      const n = pip + 1;
                      return (
                        <button
                          key={pip}
                          onClick={() => {
                            setState((prev) => {
                              const ns = [...prev.skills];
                              ns[i] = n === prev.skills[i] ? Math.max(0, n - 1) : n;
                              return { ...prev, skills: ns };
                            });
                          }}
                          title={`${n}/10`}
                          style={{
                            flex: 1,
                            height: 28,
                            border: "none",
                            borderRadius: 4,
                            cursor: "pointer",
                            background: n <= score ? color : "var(--he-border)",
                            transition: "background 0.1s",
                            padding: 0,
                          }}
                        />
                      );
                    })}
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "var(--he-text-subtle)", marginTop: 4, paddingLeft: 2, paddingRight: 2 }}>
                    <span>0</span><span>5</span><span>10</span>
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{
            borderRadius: 10, padding: "16px 20px", marginBottom: 28,
            background: gaps > 0 ? "var(--he-warning-bg)" : "var(--he-success-bg)",
            border: `1.5px solid ${gaps > 0 ? "var(--he-warning-soft)" : "var(--he-success-soft)"}`,
          }}>
            <span style={{ fontWeight: 700, fontSize: 14, color: gaps > 0 ? "var(--he-warning-text)" : "var(--he-success-text)" }}>
              {gaps > 0
                ? `${gaps} skill gap${gaps !== 1 ? "s" : ""} identified (below 6/10)`
                : "All skills on target — excellent foundation"}
            </span>
          </div>

          <div style={rowStyle}>
            <button className="he-btn-secondary" style={btnSecondary} onClick={() => update({ step: 3 })}>← Back</button>
            <button className="he-btn-primary" style={btnPrimary} onClick={() => update({ step: 5 })}>Next: Evidence Plan →</button>
          </div>
        </div>
      );

      // ── Step 5: Evidence plan ──────────────────────────────────────────────
      const renderStep5 = () => {
        const indexed = SKILLS.map((skill, i) => ({ skill, i, score: state.skills[i] }));
        const sorted = [
          ...indexed.filter((s) => s.score < 6),
          ...indexed.filter((s) => s.score >= 6),
        ];
        return (
          <div>
            <h2 style={h2Style}>Evidence Plan</h2>
            <p style={subStyle}>For each skill, note the specific evidence you will build. Be concrete — what will you do, with whom, by when?</p>

            {sorted.map(({ skill, i, score }) => {
              const isGap = score < 6;
              const color = getSkillColor(score);
              return (
                <div key={skill} style={{ ...cardBase, borderLeft: `4px solid ${isGap ? "#0D0C0C" : "#0D0C0C"}`, padding: "22px 24px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
                    <div>
                      <div style={{ fontSize: 15, fontWeight: 700, color: "var(--he-text)" }}>{skill}</div>
                      <div style={{ fontSize: 12, fontWeight: 600, color: isGap ? "var(--he-warning)" : "var(--he-success)", marginTop: 3 }}>
                        {score}/10 · {isGap ? "Gap — needs building" : "On track"}
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 3, marginLeft: 16 }}>
                      {Array.from({ length: 10 }, (_, pip) => (
                        <div key={pip} style={{ width: 12, height: 12, borderRadius: 2, background: pip < score ? color : "var(--he-border)", flexShrink: 0 }} />
                      ))}
                    </div>
                  </div>
                  <textarea
                    style={{ ...inputBase, minHeight: 80, resize: "vertical", borderColor: isGap ? "var(--he-warning-soft)" : "var(--he-success-soft)", lineHeight: 1.6 }}
                    value={state.evidence[i]}
                    onChange={(e) => {
                      const val = e.target.value;
                      setState((prev) => {
                        const ev = [...prev.evidence];
                        ev[i] = val;
                        return { ...prev, evidence: ev };
                      });
                    }}
                    placeholder={isGap
                      ? "What specific work, projects, or actions will build this skill?"
                      : "What will you do to maintain and demonstrate this strength?"}
                  />
                </div>
              );
            })}

            <div style={{ ...navyCardBase, textAlign: "center", padding: "28px 32px", fontStyle: "italic", fontSize: 17, fontWeight: 600, lineHeight: 1.5 }}>
              "Competence gets you considered. Warmth gets you chosen."
            </div>

            <div style={rowStyle}>
              <button className="he-btn-secondary" style={btnSecondary} onClick={() => update({ step: 4 })}>← Back</button>
              <button className="he-btn-primary" style={btnPrimary} onClick={() => update({ step: 6 })}>View Results →</button>
            </div>
          </div>
        );
      };

      // ── Step 6: Results ────────────────────────────────────────────────────
      const renderStep6 = () => {
        const indexed = SKILLS.map((skill, i) => ({ skill, i, score: state.skills[i] }));
        return (
          <div>
            <div style={{ ...navyCardBase, textAlign: "center", padding: "56px 32px" }}>
              <p style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--white)", margin: "0 0 16px" }}>Career Plan</p>
              <h1 style={{ fontSize: 40, fontWeight: 900, color: "var(--he-bg)", margin: "0 0 12px", lineHeight: 1.08, letterSpacing: "-0.03em" }}>{state.goal}</h1>
              <p style={{ fontSize: 17, color: "var(--he-primary-subtle)", margin: "0 0 8px" }}>{state.name}</p>
              <p style={{ fontSize: 14, color: "var(--white)", margin: 0 }}>Target: {formatDate(state.targetDate)}</p>
            </div>

            <div className="stat-grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 20 }}>
              {[
                { label: "Real Hours", value: realHours.toLocaleString() },
                { label: "Days Remaining", value: days.toLocaleString() },
                { label: "Skill Gaps", value: gaps },
                { label: "Avg Score", value: `${avgScore}/10` },
              ].map((s) => (
                <div key={s.label} style={{ background: "var(--he-surface)", borderRadius: 10, padding: "18px 12px", textAlign: "center", boxShadow: "0 1px 4px rgba(0,0,0,0.07)" }}>
                  <div style={{ fontSize: 26, fontWeight: 900, color: "var(--he-text)", letterSpacing: "-0.02em" }}>{s.value}</div>
                  <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--he-text-muted)", marginTop: 4 }}>{s.label}</div>
                </div>
              ))}
            </div>

            <div style={cardBase}>
              <h3 style={{ fontSize: 15, fontWeight: 700, margin: "0 0 24px", color: "var(--he-text)" }}>Skills Overview</h3>
              {indexed.map(({ skill, score }) => {
                const pct = (score / 10) * 100;
                const color = getSkillColor(score);
                return (
                  <div key={skill} style={{ marginBottom: 18 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                      <span style={{ fontSize: 13, fontWeight: 600, color: "var(--he-text)" }}>{skill}</span>
                      <span style={{ fontSize: 13, fontWeight: 800, color }}>{score}/10</span>
                    </div>
                    <div style={{ position: "relative", height: 18, background: "var(--he-border)", borderRadius: 4, overflow: "visible" }}>
                      <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${pct}%`, background: color, borderRadius: 4 }} />
                      <div style={{ position: "absolute", left: "60%", top: -4, bottom: -4, width: 2, background: "var(--he-text)", zIndex: 2 }} />
                    </div>
                  </div>
                );
              })}
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 12 }}>
                <div style={{ width: 2, height: 14, background: "var(--he-text)", flexShrink: 0 }} />
                <span style={{ fontSize: 11, color: "var(--he-text-muted)", fontWeight: 600 }}>Target (6/10)</span>
              </div>
            </div>

            <div style={cardBase}>
              <h3 style={{ fontSize: 15, fontWeight: 700, margin: "0 0 20px", color: "var(--he-text)" }}>Evidence Plan</h3>
              {indexed.map(({ skill, i, score }) => {
                const ev = state.evidence[i];
                const color = getSkillColor(score);
                return (
                  <div key={skill} style={{ paddingBottom: 20, marginBottom: 20, borderBottom: "1px solid var(--he-border-soft)" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                      <span style={{ fontSize: 14, fontWeight: 700, color: "var(--he-text)" }}>{skill}</span>
                      <span style={{ fontSize: 12, fontWeight: 700, color }}>{score}/10</span>
                    </div>
                    {ev.trim()
                      ? <p style={{ margin: 0, fontSize: 14, color: "var(--he-text-soft)", lineHeight: 1.65 }}>{ev}</p>
                      : <p style={{ margin: 0, fontSize: 13, color: "var(--he-text-subtle)", fontStyle: "italic" }}>No evidence noted</p>
                    }
                  </div>
                );
              })}
            </div>

            <div style={{ ...rowStyle, marginBottom: 64 }}>
              <button className="no-print he-btn-primary" style={btnPrimary} onClick={() => window.print()}>Print</button>
              <button className="no-print he-btn-secondary" style={btnSecondary} onClick={() => update({ step: 5 })}>← Back</button>
              <button className="no-print he-btn-secondary" style={{ ...btnSecondary, borderColor: "var(--he-danger)", color: "var(--he-danger)" }} onClick={startAgain}>
                Start again
              </button>
            </div>
          </div>
        );
      };

      const stepContent =
        state.step === 0 ? renderIntro() :
        state.step === 1 ? renderStep1() :
        state.step === 2 ? renderStep2() :
        state.step === 3 ? renderStep3() :
        state.step === 4 ? renderStep4() :
        state.step === 5 ? renderStep5() :
        renderStep6();

      return (
        <div style={{ fontFamily: ff, background: "var(--he-bg)", minHeight: "100vh", color: "var(--he-text)" }}>

          {state.step > 0 && (
            <div id="he-topbar" style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 100, background: "var(--he-surface)", borderBottom: "1px solid var(--he-border)" }}>
              <div style={{ height: 3, background: "var(--he-border)" }}>
                <div style={{ height: "100%", width: `${progress}%`, background: "var(--accent)", transition: "width 0.45s ease" }} />
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 24px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                  <img
                    src="assets/strategiq-logo-black.svg"
                    alt="StrategiQ"
                    style={{ height: 18, width: "auto", display: "block" }}
                  />
                  <span style={{ fontSize: 12, fontWeight: 600, color: "var(--he-text-subtle)", letterSpacing: "0.02em", opacity: 0.64 }}>
                    The Hours Exercise &nbsp;·&nbsp; Step {state.step} of 6
                  </span>
                </div>
                <span style={{ fontSize: 11, fontWeight: 700, color: "var(--he-success)", opacity: savedIndicator ? 1 : 0, transition: "opacity 0.3s" }}>
                  Saved ●
                </span>
              </div>
            </div>
          )}

          <div style={{ maxWidth: 620, margin: "0 auto", padding: state.step === 0 ? "0 24px" : "84px 24px 56px" }}>
            {stepContent}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<HoursExercise />);
  </script>
</body>
</html>
